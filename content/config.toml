[site]
title = "Qianxu Wang"
description = "Undergraduate student at Peking University, working on hardware/software co-design and AI acceleration."
url = "https://jairitage.github.io"
last_updated = "April 29, 2026"

[author]
name = "Qianxu Wang"
title = "Undergraduate Student"
institution = "Peking University"
avatar = "/bio.jpg"

[social]
# Contact information (leave blank or delete to hide)

email = "qianxu@stu.pku.edu.cn"
location = "Beijing, China"
location_url = "https://maps.google.com/?q=Peking+University"
location_details = [
  "School of EECS,",
  "Peking University, Beijing, China"
]
github = "https://github.com/jairitAge"
linkedin = "https://www.linkedin.com/in/qianxu213"
wechat_qr = "/wechat-qr-v3.jpg"

[visitors]
# Visitor map in the footer plus the /visitors page, served by the Cloudflare
# Worker in worker/ — see worker/README.md for the one-time deploy. Self-hosted
# on purpose: the two hosted services this replaced (ClustrMaps, then its
# successor MapMyVisitors) both went down and took the widget with them.
#
# Paste the URL `wrangler deploy` prints below. Leave it empty to hide the map
# in the footer and on /visitors.
enabled = true
endpoint = "https://visitor-map.jairitage.workers.dev"

[features]
# Show a like button on the about page
enable_likes = true

# Display all subpages on a single page
enable_one_page_mode = false

[i18n]
enabled = true
locales = ["zh", "en"]
default_locale = "en"
# "auto" means the locale will be determined by the browser's language setting, "fixed" means the locale will be fixed to the default locale (but can be switched still, if you want to disable, set "enable=false")
mode = "fixed"
fixed_locale = "en"
# If true, PRISM will remember user's language preference in browser's localStorage
persist = true
# Show a language switcher on the top right corner
switcher = true

[i18n.labels]
zh = "中文"
en = "English"

